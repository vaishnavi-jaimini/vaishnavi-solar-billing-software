services:
  - type: web
    name: vaishnavi-solar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Free Render Postgres expires every 30 days; vaishnavi-solar-db-3 replaced db-2 on 2026-11-18 (created in the dashboard).
      - key: DATABASE_URL
        fromDatabase:
          name: vaishnavi-solar-db-3
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://vaishnavi-solar-app.onrender.com
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: vaishnavi-solar-app
    runtime: static
    buildCommand: cd frontend/vaishnavi-solar-app && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/vaishnavi-solar-app/dist/vaishnavi-solar-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
