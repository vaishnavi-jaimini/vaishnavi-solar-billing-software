services:
  - type: web
    name: vaishnavi-solar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # vaishnavi-solar-db (free tier) expired on 2026-10-24; this replacement was created in the dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: vaishnavi-solar-db-2
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://vaishnavi-solar-app.onrender.com
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: vaishnavi-solar-app
    runtime: static
    buildCommand: cd frontend/vaishnavi-solar-app && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/vaishnavi-solar-app/dist/vaishnavi-solar-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
