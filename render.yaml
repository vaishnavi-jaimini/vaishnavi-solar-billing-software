services:
  - type: web
    name: vaishnavi-solar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Set in the Render dashboard (Internal Database URL of the current Postgres instance).
      # Not linked via fromDatabase so a replacement database can be swapped in without the blueprint reverting it.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://vaishnavi-solar-app.onrender.com
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: vaishnavi-solar-app
    runtime: static
    buildCommand: cd frontend/vaishnavi-solar-app && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/vaishnavi-solar-app/dist/vaishnavi-solar-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
