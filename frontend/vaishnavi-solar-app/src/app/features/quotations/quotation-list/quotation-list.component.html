<div class="page-header">
  <h1>Quotations</h1>
  <a mat-flat-button color="primary" routerLink="/quotations/new">
    <mat-icon>add</mat-icon> New Quotation
  </a>
</div>

<table mat-table [dataSource]="quotations" class="mat-elevation-z1">
  <ng-container matColumnDef="quotationNumber">
    <th mat-header-cell *matHeaderCellDef>Quotation #</th>
    <td mat-cell *matCellDef="let q">{{ q.quotationNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let q">{{ q.date | date: 'dd-MMM-yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let q">{{ q.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="grandTotal">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let q">₹{{ q.grandTotal | number: '1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let q">
      <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button>
      <mat-menu #menu="matMenu">
        @if (q.status !== 'Converted') {
          <button mat-menu-item (click)="convert(q)">Convert to Invoice</button>
          <button mat-menu-item (click)="delete(q)">Delete</button>
        } @else {
          <button mat-menu-item disabled>Already converted</button>
        }
      </mat-menu>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
