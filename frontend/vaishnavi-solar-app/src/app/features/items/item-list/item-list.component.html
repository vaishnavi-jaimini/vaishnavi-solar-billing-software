<div class="page-header">
  <h1>Items</h1>
  <button mat-flat-button color="primary" (click)="openForm(null)">
    <mat-icon>add</mat-icon> Add Item
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search by name or HSN/SAC</mat-label>
  <input matInput [(ngModel)]="search" (ngModelChange)="load()" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<table mat-table [dataSource]="items" class="mat-elevation-z1">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let i">{{ i.name }}</td>
  </ng-container>
  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Category</th>
    <td mat-cell *matCellDef="let i">{{ categoryLabel(i.category) }}</td>
  </ng-container>
  <ng-container matColumnDef="hsn">
    <th mat-header-cell *matHeaderCellDef>HSN/SAC</th>
    <td mat-cell *matCellDef="let i">{{ i.hsnSacCode }}</td>
  </ng-container>
  <ng-container matColumnDef="unit">
    <th mat-header-cell *matHeaderCellDef>Unit</th>
    <td mat-cell *matCellDef="let i">{{ i.unit }}</td>
  </ng-container>
  <ng-container matColumnDef="rate">
    <th mat-header-cell *matHeaderCellDef>Rate</th>
    <td mat-cell *matCellDef="let i">₹{{ i.rate | number: '1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="gst">
    <th mat-header-cell *matHeaderCellDef>GST %</th>
    <td mat-cell *matCellDef="let i">{{ i.gstPercent }}%</td>
  </ng-container>
  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef>Stock</th>
    <td mat-cell *matCellDef="let i">
      @if (i.isService) {
        <span>—</span>
      } @else {
        <span [class.low-stock]="i.currentStock <= i.lowStockThreshold">{{ i.currentStock }}</span>
      }
    </td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let i">
      @if (!i.isService) {
        <button mat-icon-button matTooltip="Adjust stock" (click)="adjustStock(i)">
          <mat-icon>inventory</mat-icon>
        </button>
      }
      <button mat-icon-button (click)="openForm(i)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button (click)="delete(i)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
