<div class="page-header">
  <h1>Payments</h1>
  <button mat-flat-button color="primary" (click)="openForm()">
    <mat-icon>add</mat-icon> Record Payment
  </button>
</div>

<table mat-table [dataSource]="payments" class="mat-elevation-z1">
  <ng-container matColumnDef="paymentDate">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let p">{{ p.paymentDate | date: 'dd-MMM-yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="invoiceNumber">
    <th mat-header-cell *matHeaderCellDef>Invoice #</th>
    <td mat-cell *matCellDef="let p">{{ p.invoiceNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let p">{{ p.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let p">₹{{ p.amount | number: '1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="mode">
    <th mat-header-cell *matHeaderCellDef>Mode</th>
    <td mat-cell *matCellDef="let p">{{ p.mode }}</td>
  </ng-container>
  <ng-container matColumnDef="referenceNo">
    <th mat-header-cell *matHeaderCellDef>Reference</th>
    <td mat-cell *matCellDef="let p">{{ p.referenceNo || '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let p">
      <button mat-icon-button (click)="delete(p)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
