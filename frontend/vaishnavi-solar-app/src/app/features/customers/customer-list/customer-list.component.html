<div class="page-header">
  <h1>Customers</h1>
  <button mat-flat-button color="primary" (click)="openForm(null)">
    <mat-icon>add</mat-icon> Add Customer
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search by name or phone</mat-label>
  <input matInput [(ngModel)]="search" (ngModelChange)="load()" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<table mat-table [dataSource]="customers" class="mat-elevation-z1">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let c">{{ c.name }}</td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let c">{{ c.phone }}</td>
  </ng-container>
  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>City</th>
    <td mat-cell *matCellDef="let c">{{ c.city }}</td>
  </ng-container>
  <ng-container matColumnDef="state">
    <th mat-header-cell *matHeaderCellDef>State</th>
    <td mat-cell *matCellDef="let c">{{ c.state }}</td>
  </ng-container>
  <ng-container matColumnDef="gstin">
    <th mat-header-cell *matHeaderCellDef>GSTIN</th>
    <td mat-cell *matCellDef="let c">{{ c.gstin || '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let c">
      <button mat-icon-button (click)="openForm(c)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button (click)="delete(c)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (customers.length === 0) {
  <p class="empty-state">No customers yet. Click "Add Customer" to create one.</p>
}
