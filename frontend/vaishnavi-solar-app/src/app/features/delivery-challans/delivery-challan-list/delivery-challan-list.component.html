<div class="page-header">
  <h1>Delivery Challans</h1>
  <a mat-flat-button color="primary" routerLink="/delivery-challans/new">
    <mat-icon>add</mat-icon> New Delivery Challan
  </a>
</div>

<table mat-table [dataSource]="challans" class="mat-elevation-z1">
  <ng-container matColumnDef="challanNumber">
    <th mat-header-cell *matHeaderCellDef>Challan #</th>
    <td mat-cell *matCellDef="let c">
      <a [routerLink]="['/delivery-challans', c.id]">{{ c.challanNumber }}</a>
    </td>
  </ng-container>
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let c">{{ c.challanDate | date: 'dd-MMM-yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let c">{{ c.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="vehicleNumber">
    <th mat-header-cell *matHeaderCellDef>Vehicle No.</th>
    <td mat-cell *matCellDef="let c">{{ c.vehicleNumber || '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="grandTotal">
    <th mat-header-cell *matHeaderCellDef>Value</th>
    <td mat-cell *matCellDef="let c">₹{{ c.grandTotal | number: '1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let c">
      <a mat-icon-button matTooltip="Print" [routerLink]="['/delivery-challans', c.id, 'print']"><mat-icon>print</mat-icon></a>
      <a mat-icon-button matTooltip="Edit" [routerLink]="['/delivery-challans', c.id, 'edit']"><mat-icon>edit</mat-icon></a>
      <button mat-icon-button matTooltip="Delete" (click)="delete(c)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
