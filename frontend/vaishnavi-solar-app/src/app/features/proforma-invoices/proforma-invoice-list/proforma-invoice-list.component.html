<div class="page-header">
  <h1>Proforma Invoices</h1>
  <a mat-flat-button color="primary" routerLink="/proforma-invoices/new">
    <mat-icon>add</mat-icon> New Proforma Invoice
  </a>
</div>

<table mat-table [dataSource]="proformaInvoices" class="mat-elevation-z1">
  <ng-container matColumnDef="proformaNumber">
    <th mat-header-cell *matHeaderCellDef>Proforma #</th>
    <td mat-cell *matCellDef="let p">
      <a [routerLink]="['/proforma-invoices', p.id]">{{ p.proformaNumber }}</a>
    </td>
  </ng-container>
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let p">{{ p.proformaDate | date: 'dd-MMM-yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let p">{{ p.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="grandTotal">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let p">₹{{ p.grandTotal | number: '1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let p">
      <a mat-icon-button [routerLink]="['/proforma-invoices', p.id, 'print']"><mat-icon>print</mat-icon></a>
      @if (!p.convertedInvoiceId) {
        <a mat-icon-button matTooltip="Edit" [routerLink]="['/proforma-invoices', p.id, 'edit']"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button matTooltip="Convert to Invoice" (click)="convert(p)"><mat-icon>sync_alt</mat-icon></button>
        <button mat-icon-button (click)="delete(p)"><mat-icon>delete</mat-icon></button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
